
name: Vishal Jarvis Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Vishal-Jarvis-AI-New.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify ZIP File
        run: |
          test -f Vishal-Jarvis-AI-New.zip

      - name: Extract Android Project
        run: |
          mkdir -p source
          unzip -q Vishal-Jarvis-AI-New.zip -d source

      - name: Locate Android Project
        run: |
          PROJECT_FILE=$(find source -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app folder not found"
            exit 1
          fi

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/Vishal-Jarvis-AI-New.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Vishal-Jarvis-AI-New-APK
          path: artifacts/Vishal-Jarvis-AI-New.apk
          if-no-files-found: error
